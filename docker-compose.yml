services:
  # Web dashboard: docker compose up -d web
  # Open http://localhost:5000
  web:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./static:/app/static:ro
    ports:
      - "5090:5000"
    entrypoint: ["python", "web.py"]
    restart: unless-stopped

  # Automated daily scan (runs alongside web)
  scheduler:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      while true; do
        python main.py check --notify;
        sleep 86400;
      done
    restart: unless-stopped

  # Manual one-shot: docker compose run --rm app check|list|report
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    profiles: ["manual"]
    command: check
